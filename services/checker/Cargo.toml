[package]
name = "modelshelf-checker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "modelshelf-checker"
path = "src/main.rs"

[dependencies]
ifc-model.workspace = true
ids.workspace = true
fingerprint.workspace = true
modeldiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10"
hex = "0.4.3"
anyhow = "1.0.104"
tracing = "0.1.44"
tokio-util = "0.7.19"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
