[workspace]
resolver = "2"
members = ["crates/ifc-model", "crates/ids", "crates/fingerprint", "crates/modeldiff", "services/checker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
ifc-model = { path = "crates/ifc-model" }
ids = { path = "crates/ids" }
fingerprint = { path = "crates/fingerprint" }
modeldiff = { path = "crates/modeldiff" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
