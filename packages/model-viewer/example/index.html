<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>model-viewer standalone example</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1e293b; flex-wrap: wrap; }
      header h1 { font-size: 14px; margin: 0 12px 0 0; }
      header button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
      header button:hover { background: #334155; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: calc(100vh - 48px); }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      aside { border-left: 1px solid #1e293b; padding: 12px; overflow-y: auto; font-size: 12px; }
      aside h2 { font-size: 13px; margin: 0 0 8px; }
      pre { white-space: pre-wrap; background: #020617; border: 1px solid #1e293b; padding: 8px; border-radius: 6px; }
      .status { color: #94a3b8; }
    </style>
  </head>
  <body>
    <header>
      <h1>model-viewer standalone</h1>
      <button type="button" id="pick">Pick</button>
      <button type="button" id="highlight">Highlight</button>
      <button type="button" id="isolate">Isolate</button>
      <button type="button" id="section">Section</button>
      <button type="button" id="unload">Unload</button>
      <span class="status">Checker, worker, and Next.js are stopped. Public core exports only.</span>
    </header>
    <main>
      <canvas id="viewer" aria-label="Standalone viewer canvas"></canvas>
      <aside>
        <h2>Viewer state</h2>
        <pre id="state">loading…</pre>
      </aside>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
