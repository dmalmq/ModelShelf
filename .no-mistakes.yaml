# Personal repo: honor gate-control fields from the pushed branch, not only main.
allow_repo_commands: true

# No GitHub Actions workflows exist yet. Local no-mistakes is the validation gate.
no_ci: true

auto_fix:
  review: 0

ignore_patterns:
  - "generated.rs"
  - "generated.py"
  - "generated.ts"
  - "Cargo.lock"
  - "package-lock.json"
  - "uv.lock"
  - ".omo/**"

document:
  instructions: |
    CONTEXT.md owns domain terms.
    docs/adr owns module boundaries.
    docs/contracts owns HTTP and worker envelopes.
    schemas/model/v1 owns shared model payloads.
    README.md owns how to run the local app.
    Do not duplicate those facts in AGENTS.md or ticket Answers.

review:
  path_instructions:
    - path: "crates/ids/**"
      instructions: |
        crates/ids is a reference and test engine. Do not grow it into the live IDS scorer. IfcTester scores live runs.
    - path: "schemas/model/v1/**"
      instructions: |
        JSON Schema is the one source for shared model payloads. Generated Rust, Python, and TypeScript consumers must not be hand-edited out of sync.
    - path: "services/ifc-worker/**"
      instructions: |
        The worker is authoritative for IFC meaning. Unsupported evaluation is incomplete, never a pass. Keep job envelopes out of the shared model schema.
    - path: "apps/web/**"
      instructions: |
        The viewer does not own checking policy, finding color, or which revision is better. Selection uses opaque ObjectRefs.
    - path: "services/checker/**"
      instructions: |
        Revisions, original bytes, and finalized delivery membership stay immutable. Unpinned run inputs stay incomplete. Do not guess lineage.

protected_paths:
  - "samples/ifc/**"
  - "packs/demo/fixtures/**"
